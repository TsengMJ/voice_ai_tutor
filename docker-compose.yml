name: voice-ai-tutor

x-node-env: &node-env
  NODE_ENV: production
  REDIS_URL: redis://redis:6379
  DATABASE_URL: postgres://tutor:${POSTGRES_PASSWORD:-tutor}@postgres:5432/tutor

services:
  web:
    build:
      context: .
      target: web
    ports:
      - '${WEB_PORT:-3000}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      <<: *node-env
      PORT: '4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  agent:
    build:
      context: .
      target: agent
    env_file: .env
    environment:
      <<: *node-env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutor}
      POSTGRES_DB: tutor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tutor -d tutor']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Throwaway datastores published on localhost for `npm test`:
  #   docker compose --profile test up -d redis-test postgres-test
  redis-test:
    profiles: ['test']
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6380:6379'

  postgres-test:
    profiles: ['test']
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: tutor_test
    ports:
      - '127.0.0.1:5433:5432'

volumes:
  pgdata:
  redisdata:
